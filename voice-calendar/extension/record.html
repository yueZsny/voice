<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; background: #111827; color: #fff;
      user-select: none; -webkit-user-select: none;
    }
    h2 { font-size: 18px; margin-bottom: 10px; }
    .timer { font-size: 42px; font-weight: 700; margin: 10px 0; font-variant-numeric: tabular-nums; }
    button {
      padding: 12px 40px; font-size: 16px; border: none; border-radius: 50px;
      cursor: pointer; font-weight: 600; transition: all 0.2s;
    }
    .btn-stop { background: #ef4444; color: #fff; margin-top: 12px; }
    .btn-stop:hover { background: #dc2626; transform: scale(1.05); }
    .btn-stop:disabled { opacity: 0.5; cursor: default; transform: none; }
    .status { color: #9ca3af; font-size: 13px; margin-top: 8px; text-align: center; }
    .error { color: #fca5a5; margin-top: 8px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <h2>🎤 正在录音…</h2>
  <div class="timer" id="timer">00:00</div>
  <button class="btn-stop" id="stopBtn">⏹ 停止录音</button>
  <div class="status" id="status"></div>
  <div class="error" id="error"></div>
  <script src="record.js"></script>
</body>
</html>
